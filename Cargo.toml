[workspace]
resolver = "2"
members = [
    "crates/backed",
    "crates/backed-chaos",
    "contracts/checker",
    "contracts/examples/naive-vault",
    "contracts/examples/backed-vault",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rohan911438/Backed"

[workspace.dependencies]
near-sdk = "5.29.0"
backed = { path = "crates/backed" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
