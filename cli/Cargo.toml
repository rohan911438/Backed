[package]
name = "backed-cli"
description = "Check whether NEAR protocols hold what they owe, at one block height."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "backed"
path = "src/main.rs"

[features]
# `backed chaos`: replays the 2026 incidents on a local NEAR sandbox
# (Linux, macOS or WSL). `cargo install --path cli --features chaos`
chaos = ["dep:backed-chaos"]

[dependencies]
backed-chaos = { path = "../crates/backed-chaos", features = ["sandbox"], optional = true }
backed-checker-logic = { path = "../crates/checker-logic" }
# lets near-sdk (pulled in by the checker logic) compile outside a contract
near-sdk = { workspace = true, features = ["non-contract-usage"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
