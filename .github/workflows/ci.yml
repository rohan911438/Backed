name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (library, checker, chaos, example vaults)
        run: cargo test -p backed -p backed-checker -p backed-chaos -p naive-vault -p backed-vault
      - name: Build CLI
        run: cargo build -p backed-cli

  replays:
    # The three 2026 incident replays on a real local NEAR sandbox.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-near
        run: cargo binstall --no-confirm cargo-near@0.22.0
      - name: Build contracts
        run: scripts/build-wasm.sh
      - name: Replays (naive loses, backed holds)
        run: cargo test -p backed-chaos --features sandbox --test replays -- --nocapture --test-threads=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
